services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Development-only credentials.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_ai
    ports:
      # Bound to localhost only. Override the host port with POSTGRES_PORT if 5432 is taken.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      # Later files win, so the repository .env can override backend/.env.
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/personal_ai
    ports:
      # Bound to localhost only. Override the host port with BACKEND_PORT if 8000 is taken.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # The browser talks to the backend on the host port, not the container name.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
